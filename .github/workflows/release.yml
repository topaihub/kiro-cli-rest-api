name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-linux
            artifact: kiro-cli-rest-api-linux-x86_64
          - target: aarch64-linux
            artifact: kiro-cli-rest-api-linux-aarch64
          - target: aarch64-macos
            artifact: kiro-cli-rest-api-macos-aarch64
          - target: x86_64-macos
            artifact: kiro-cli-rest-api-macos-x86_64
          - target: x86_64-windows
            artifact: kiro-cli-rest-api-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build ReleaseSmall
        run: zig build -Doptimize=ReleaseSmall -Dtarget=${{ matrix.target }}

      - name: Package binary
        run: |
          mkdir -p dist
          cp zig-out/bin/kiro-cli-rest-api dist/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
